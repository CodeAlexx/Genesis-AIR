# The AIR toolchain Genesis AIR is built against.
#
# AIR_SDK is a checkout of CodeAlexx/AIR pinned to the commit that carries the portable NLE
# toolkit (std.editor / std.editor_io / std.editor_view). AIR source is never copied into
# this project; it is discovered here.
AIR_SDK=${AIR_SDK:-/home/alex/air-sdk-nle}
AIR_SDK_COMMIT=a707b44c4aa6f6f2ea18e90470544b82e441bc0b
AIR_SDK_BRANCH=portable-nle-toolkit

# Where the compiler binary lives. The NLE commit changes no compiler source, so a compiler
# built from its base (b6ae48b) is the right one.
AIR_TOOLCHAIN=${AIR_TOOLCHAIN:-/home/alex/air-lang}
