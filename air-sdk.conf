# The AIR toolchain Genesis AIR is built against.
#
# AIR_SDK is a checkout of CodeAlexx/AIR at or after the pinned branch commit. It carries
# the portable NLE toolkit, process pipes, and the compiler opcodes this app uses.
# AIR source is discovered here. Both build scripts apply the maintained shared
# patches/air-editor.patch overlay before compiling the application.
AIR_SDK=${AIR_SDK:-../AIR}
AIR_SDK_COMMIT=64b8ce61c13a3303137bd31d0432c99cfa996f7d
AIR_SDK_BRANCH=genesis-sdk
# The genesis-sdk branch is AIR main plus the Genesis overlays as commits, so the
# build scripts skip applying patches/*.patch to it.
AIR_SDK_PREPARED=1

# Where the compiler binary lives.
#
# Build a matching compiler in AIR's build-gcc15 tree, or override AIRC explicitly.
AIR_TOOLCHAIN=${AIR_TOOLCHAIN:-../AIR}
