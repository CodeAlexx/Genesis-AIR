# The AIR toolchain Genesis AIR is built against.
#
# AIR_SDK is a checkout of CodeAlexx/AIR pinned to the commit that carries the portable NLE
# toolkit (std.editor / std.editor_io / std.editor_view) and the redrawn std.vector_font.
# AIR source is never copied into this project; it is discovered here.
AIR_SDK=${AIR_SDK:-../air-sdk-nle}
AIR_SDK_COMMIT=397c4f1aef1f8a90acaf4194b458f775e48dbce6
AIR_SDK_BRANCH=windows-native

# Where the compiler binary lives.
#
# The pinned commit changes stdlib only, so any compiler built from its base is correct for
# it — but that base is AIR main, whose std.process uses the persistent-pipe opcodes. This
# application imports std.process, so the compiler has to be one that knows them: the
# pre-merge build cannot compile this stdlib.
AIR_TOOLCHAIN=${AIR_TOOLCHAIN:-../air-process-pipes}
